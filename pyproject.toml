[project]
name = "agente-ferrepro"
version = "0.1.0"
description = "Agente de WhatsApp (Chatwoot) para Ferrepro: lee productos de Supabase y responde consultas."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pydantic-ai>=0.0.49",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "redis>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md"]
