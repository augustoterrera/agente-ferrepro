services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # build: para dev (local). image: la que se pushea a GHCR y que prod baja con `docker compose pull`.
  # El código va dentro de la imagen (sin mount en prod) → lo que se testeó en CI es lo que corre.
  # El mount en vivo para dev está en docker-compose.override.yml (se auto-carga sin -f).
  api:
    build: .
    image: ghcr.io/augustoterrera/agente-ferrepro:latest
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    # Sin puerto publicado al host: el ingress es Traefik (prod) o ngrok (dev), que llegan a
    # api:8000 por la red interna de Docker. Para debug local: docker compose exec api ...
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker_messages:
    build: .
    image: ghcr.io/augustoterrera/agente-ferrepro:latest
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    command: celery -A app.celery_app.celery_app worker -Q chatwoot_messages --concurrency=4 -l info
    depends_on:
      - redis

  worker_outbound:
    build: .
    image: ghcr.io/augustoterrera/agente-ferrepro:latest
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    command: celery -A app.celery_app.celery_app worker -Q chatwoot_outbound --concurrency=2 -l info
    depends_on:
      - redis

  beat:
    build: .
    image: ghcr.io/augustoterrera/agente-ferrepro:latest
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    command: celery -A app.celery_app.celery_app beat -l info
    depends_on:
      - redis

# Prod: el HTTPS/reverse-proxy lo da el Traefik ya existente del VPS. Ver docker-compose.prod.yml
# (enchufa el api al Traefik por labels + red externa). No incluimos proxy propio para no
# competir por 80/443.

volumes:
  redis_data:
